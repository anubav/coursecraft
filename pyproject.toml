[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coursecraft"
version = "0.1.0"
description = "Generate section-specific course sites from a logic-notes-style master repo"
requires-python = ">=3.10"
dependencies = ["pyyaml", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
coursecraft = "coursecraft.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/coursecraft"]
